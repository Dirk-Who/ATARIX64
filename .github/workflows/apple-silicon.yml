name: Apple Silicon build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install universal SDL2 framework
        run: bash ./scripts/bootstrap-sdl2.sh

      - name: Build AtariX for arm64
        run: |
          xcodebuild \
            -project src/AtariX-MT/AtariX/AtariX.xcodeproj \
            -scheme AtariX-Application \
            -configuration Release \
            -derivedDataPath "${RUNNER_TEMP}/AtariXDerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify architecture and version
        run: |
          APP="${RUNNER_TEMP}/AtariXDerivedData/Build/Products/Release/AtariX.app"
          lipo -info "${APP}/Contents/MacOS/AtariX"
          lipo -info "${APP}/Contents/Frameworks/SDL2.framework/SDL2"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APP}/Contents/Info.plist")" = "0.6.4"

      - name: Ad-hoc sign application bundle
        run: |
          APP="${RUNNER_TEMP}/AtariXDerivedData/Build/Products/Release/AtariX.app"
          SDL_FRAMEWORK="${APP}/Contents/Frameworks/SDL2.framework"
          codesign --force --sign - "${SDL_FRAMEWORK}"
          codesign --verify --strict --verbose=2 "${SDL_FRAMEWORK}"
          codesign --force --sign - "${APP}"
          codesign --verify --deep --strict --verbose=2 "${APP}"

      - name: Package ATARIX-A64-0.6.4-Mouse-Performance-Test5
        run: |
          APP="${RUNNER_TEMP}/AtariXDerivedData/Build/Products/Release/AtariX.app"
          ditto -c -k --sequesterRsrc --keepParent "${APP}" "${RUNNER_TEMP}/ATARIX-A64-0.6.4-Mouse-Performance-Test5.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ATARIX-A64-0.6.4-Mouse-Performance-Test5
          path: ${{ runner.temp }}/ATARIX-A64-0.6.4-Mouse-Performance-Test5.zip
          if-no-files-found: error

      - name: Publish ATARIX-A64-0.6.4-Mouse-Performance-Test5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ATARIX-A64-0.6.4-Mouse-Performance-Test5
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; nothing to publish."
          else
            gh release create "${RELEASE_TAG}" \
              "${RUNNER_TEMP}/ATARIX-A64-0.6.4-Mouse-Performance-Test5.zip#ATARIX-A64-0.6.4-Mouse-Performance-Test5.zip" \
              --target "${GITHUB_SHA}" \
              --title "ATARIX-A64-0.6.4-Mouse-Performance-Test5" \
              --notes-file RELEASE_NOTES_0.6.md
          fi
