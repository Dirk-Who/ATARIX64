name: Publish AtariX 0.5 release

on:
  push:
    paths:
      - .github/workflows/_temporary_release_v05.yml

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AtariX-0.5-Apple-Silicon
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Dirk-Who/ATARIX64
          run-id: 33279787651
          path: release

      - name: Verify release archive
        run: |
          test -s release/AtariX-0.5-Apple-Silicon.zip
          sha256sum release/AtariX-0.5-Apple-Silicon.zip

      - name: Create GitHub Release v0.5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.5 release/AtariX-0.5-Apple-Silicon.zip \
            --repo Dirk-Who/ATARIX64 \
            --target 9d989b4475c1b249a3bfe1f05ff724ff5909d647 \
            --title "AtariX 0.5" \
            --notes "Apple-Silicon-Version von AtariX 0.5. Enthalten sind der aktualisierte Musashi-680x0-Kern (Upstream-Commit 313ebf1bd9f4d0d93341eb5ce21fd8a119e9dbdd), die MagicMac-Hostcall-Opcodes 0x00c0 und 0x00c1, die ARM64-Korrektur für synchrone Busfehler und die korrigierte Framebuffer-Adressierung. Erfolgreich unter macOS 15 für ARM64 gebaut; SDL2 ist universal. Die App ist nicht mit einem Apple-Entwicklerzertifikat signiert. Falls macOS sie blockiert: xattr -dr com.apple.quarantine AtariX.app"
